services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    # Concurrency defaults to CPU count; each forked child that handles a
    # task keeps its DB connection open afterward (SQLAlchemy pools reuse,
    # don't close). Supabase's session-mode pooler caps at 15 total
    # connections across the whole app (api + worker children + beat), so
    # concurrency has to stay well under that or a handful of concurrent
    # tasks exhausts it — confirmed live.
    command: uv run celery -A soteria.worker.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: .
    command: uv run celery -A soteria.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
